zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates
  host_groups:
    - uuid: 2f6bcd173eff433fa31b30ddb5222a6a
      name: 4951-RZEN-SRV
  templates:
    - uuid: 4ff9ca4d3943410b9d23cdf62368601e
      template: 'template ansible zabbix agent active'
      name: 'template ansible zabbix agent active'
      description: |
        This template was created by Thomas Rzen.
        
        To ensure this template functions correctly, follow this guide: 
        https://github.com/Garfieldttt/zabbix-ansible
      groups:
        - name: Templates
      items:
        - uuid: d5493faad69248409c2f0c5c84879adf
          name: ansible.log.raw
          type: ZABBIX_ACTIVE
          key: 'vfs.file.contents[{$ANSIBLE_LOGFILE}]'
          history: '0'
          value_type: TEXT
          trends: '0'
      discovery_rules:
        - uuid: 404cb67a1d7f45e1801e23eceae56030
          name: ansible-jobs
          type: DEPENDENT
          key: ansible.jobs
          delay: '0'
          item_prototypes:
            - uuid: 31a821fc347f42b2b5d3fd7650887daf
              name: 'Ansible tasks failed {#ANSIBLE_HOSTNAME}'
              type: DEPENDENT
              key: 'ansible.changed.failed[{#ANSIBLE_HOSTNAME}]'
              delay: '0'
              trends: '0'
              description: 'Number of failed tasks'
              valuemap:
                name: Ansible-tasks-failed
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.host == "{#ANSIBLE_HOSTNAME}")].failed_tasks'
                - type: LTRIM
                  parameters:
                    - '["'
                - type: RTRIM
                  parameters:
                    - '"]'
              master_item:
                key: 'vfs.file.contents[{$ANSIBLE_LOGFILE}]'
              tags:
                - tag: Ansible
                  value: failed-tasks
            - uuid: f9cdb1969a71417782d95869a2dfc66d
              name: 'Host "{#ANSIBLE_HOSTNAME}"  - last playbook run'
              type: DEPENDENT
              key: 'ansible.changed.last_run[{#ANSIBLE_HOSTNAME}]'
              delay: '0'
              value_type: TEXT
              trends: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.host == "{#ANSIBLE_HOSTNAME}")].last_run'
                - type: LTRIM
                  parameters:
                    - '["'
                - type: RTRIM
                  parameters:
                    - '"]'
              master_item:
                key: 'vfs.file.contents[{$ANSIBLE_LOGFILE}]'
              tags:
                - tag: Ansible
                  value: last-run
            - uuid: c9e31769b2c04ee49c24ba06ccbaff28
              name: 'Last executed playbook: {#ANSIBLE_HOSTNAME}'
              type: DEPENDENT
              key: 'ansible.changed.playbook_name[{#ANSIBLE_HOSTNAME}]'
              delay: '0'
              value_type: TEXT
              trends: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.host == "{#ANSIBLE_HOSTNAME}")].job_name'
                - type: LTRIM
                  parameters:
                    - '["'
                - type: RTRIM
                  parameters:
                    - '"]'
                - type: REGEX
                  parameters:
                    - '[^/]+$'
                    - \0
              master_item:
                key: 'vfs.file.contents[{$ANSIBLE_LOGFILE}]'
              tags:
                - tag: Ansible
                  value: last-executed-playbook
            - uuid: d243bb5cb52a4b1db73719cb13ca412f
              name: 'Ansible tasks skipped {#ANSIBLE_HOSTNAME}'
              type: DEPENDENT
              key: 'ansible.changed.skipped[{#ANSIBLE_HOSTNAME}]'
              delay: '0'
              trends: '0'
              description: 'Number of skipped tasks'
              valuemap:
                name: Ansible-tasks-skipped
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.host == "{#ANSIBLE_HOSTNAME}")].skipped_tasks'
                - type: LTRIM
                  parameters:
                    - '["'
                - type: RTRIM
                  parameters:
                    - '"]'
              master_item:
                key: 'vfs.file.contents[{$ANSIBLE_LOGFILE}]'
              tags:
                - tag: Ansible
                  value: skipped-tasks
            - uuid: c66a2403031b43708846b01df4581fc9
              name: 'Ansible tasks success {#ANSIBLE_HOSTNAME}'
              type: DEPENDENT
              key: 'ansible.changed.success_tasks[{#ANSIBLE_HOSTNAME}]'
              delay: '0'
              trends: '0'
              description: 'Number of successful tasks'
              valuemap:
                name: Ansible-tasks-success
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.host == "{#ANSIBLE_HOSTNAME}")].success_tasks'
                - type: LTRIM
                  parameters:
                    - '["'
                - type: RTRIM
                  parameters:
                    - '"]'
              master_item:
                key: 'vfs.file.contents[{$ANSIBLE_LOGFILE}]'
              tags:
                - tag: Ansible
                  value: success-tasks
            - uuid: 13cdd88ef1a440bab2094ad406d4441d
              name: 'Ansible task status {#ANSIBLE_HOSTNAME}'
              type: DEPENDENT
              key: 'ansible.changed.task.status[{#ANSIBLE_HOSTNAME}]'
              delay: '0'
              trends: '0'
              valuemap:
                name: Ansible-tast-status
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.host == "{#ANSIBLE_HOSTNAME}")].status'
                - type: LTRIM
                  parameters:
                    - '["'
                - type: RTRIM
                  parameters:
                    - '"]'
                - type: STR_REPLACE
                  parameters:
                    - success
                    - '1'
                - type: STR_REPLACE
                  parameters:
                    - failed
                    - '2'
                - type: STR_REPLACE
                  parameters:
                    - unreachable
                    - '3'
              master_item:
                key: 'vfs.file.contents[{$ANSIBLE_LOGFILE}]'
              tags:
                - tag: Ansible
                  value: task-status
              trigger_prototypes:
                - uuid: b0d142e2458948719caffd893761fe7f
                  expression: 'last(/template ansible zabbix agent active/ansible.changed.task.status[{#ANSIBLE_HOSTNAME}])=2 and {$ANSIBLE_TRIGGER_TOGGLE_JOB:"{#ANSIBLE_HOSTNAME}"}=1'
                  name: 'Ansible job failed {#ANSIBLE_HOSTNAME}'
                  priority: DISASTER
                  manual_close: 'YES'
            - uuid: 6331f81d5ebf47a38aa11e77611e89b1
              name: 'Ansible tasks unreachable {#ANSIBLE_HOSTNAME}'
              type: DEPENDENT
              key: 'ansible.changed.unreachable[{#ANSIBLE_HOSTNAME}]'
              delay: '0'
              trends: '0'
              valuemap:
                name: Ansible-tasks-unreachable
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.host == "{#ANSIBLE_HOSTNAME}")].unreachable'
                - type: LTRIM
                  parameters:
                    - '["'
                - type: RTRIM
                  parameters:
                    - '"]'
                - type: STR_REPLACE
                  parameters:
                    - 'false'
                    - '0'
                - type: STR_REPLACE
                  parameters:
                    - 'true'
                    - '1'
              master_item:
                key: 'vfs.file.contents[{$ANSIBLE_LOGFILE}]'
              tags:
                - tag: Ansible
                  value: unreachable
              trigger_prototypes:
                - uuid: 8f97d222bf714a939789f4ae32f49fbe
                  expression: 'last(/template ansible zabbix agent active/ansible.changed.unreachable[{#ANSIBLE_HOSTNAME}])=1 and {$ANSIBLE_TRIGGER_TOGGLE_UNREACHABLE:"{#ANSIBLE_HOSTNAME}"}=1'
                  name: 'Ansible job unreachable {#ANSIBLE_HOSTNAME}'
                  priority: HIGH
                  manual_close: 'YES'
          host_prototypes:
            - uuid: 9ca079eb02da43429e817391e3d748d8
              host: '{#VM.UUID}'
              name: '{#VM.NAME}'
              inventory_mode: AUTOMATIC
              group_links:
                - group:
                    name: 4951-RZEN-SRV
          master_item:
            key: 'vfs.file.contents[{$ANSIBLE_LOGFILE}]'
          lld_macro_paths:
            - lld_macro: '{#ANSIBLE_HOSTNAME}'
              path: $.host
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[*]'
      macros:
        - macro: '{$ANSIBLE_LOGFILE}'
          value: /var/log/ansible.log
          description: 'Ansible log path'
        - macro: '{$ANSIBLE_TRIGGER_TOGGLE_JOB}'
          value: '1'
          description: 'on=1 off=2'
        - macro: '{$ANSIBLE_TRIGGER_TOGGLE_UNREACHABLE}'
          value: '1'
          description: 'on=1 off=2'
      dashboards:
        - uuid: 422e661e4c0247c3b677f6c5276cabd7
          name: Ansible-Jobs
          pages:
            - widgets:
                - type: graphprototype
                  name: 'Ansible Jobs Overview'
                  width: '72'
                  height: '6'
                  fields:
                    - type: STRING
                      name: reference
                      value: NTWBQ
                - type: graphprototype
                  'y': '6'
                  width: '72'
                  height: '5'
                  fields:
                    - type: STRING
                      name: reference
                      value: OZTSN
                    - type: INTEGER
                      name: source_type
                      value: '3'
                - type: graphprototype
                  'y': '11'
                  width: '72'
                  height: '5'
                  fields:
                    - type: STRING
                      name: reference
                      value: BDXGC
                    - type: INTEGER
                      name: source_type
                      value: '3'
                - type: graphprototype
                  'y': '16'
                  width: '72'
                  height: '6'
                  fields:
                    - type: STRING
                      name: reference
                      value: VVZML
                    - type: INTEGER
                      name: source_type
                      value: '3'
                - type: graphprototype
                  'y': '22'
                  width: '72'
                  height: '5'
                  fields:
                    - type: STRING
                      name: reference
                      value: SUNLP
                    - type: INTEGER
                      name: source_type
                      value: '3'
      valuemaps:
        - uuid: d4a1d9102a164c99b66a9ccca86571be
          name: Ansible-tasks-failed
          mappings:
            - type: IN_RANGE
              value: 0-999999
              newvalue: failed
        - uuid: 6fd5e52f491d4f76a2c95e98aa9fbeb9
          name: Ansible-tasks-skipped
          mappings:
            - type: IN_RANGE
              value: 0-999999
              newvalue: skipped
        - uuid: 514dc50ce3314a57823f8790093c1dae
          name: Ansible-tasks-success
          mappings:
            - type: IN_RANGE
              value: 0-999999
              newvalue: success
        - uuid: 6c37a36ca20340a5b26738f8bc265478
          name: Ansible-tasks-unreachable
          mappings:
            - type: IN_RANGE
              value: 0-1
              newvalue: unreachable
        - uuid: b3599ca006c4441f8627475854741454
          name: Ansible-tast-status
          mappings:
            - value: '1'
              newvalue: success
            - value: '2'
              newvalue: failed
            - value: '3'
              newvalue: unreachable
